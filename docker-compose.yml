services:
  # ==========================================
  # PostgreSQL 16 + PostGIS 3.4 Database
  # ==========================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: naam-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naam}
      POSTGRES_USER: ${POSTGRES_USER:-naamuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naam_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naamuser} -d ${POSTGRES_DB:-naam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # FastAPI ASGI Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naam-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-naamuser}:${POSTGRES_PASSWORD:-naam_secure_password_2026}@db:5432/${POSTGRES_DB:-naam}
      SECRET_KEY: ${SECRET_KEY:-naam_production_jwt_secret_key_change_in_production_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173", "https://naam.kerala.gov.in"]'
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # React + Vite Production Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naam-frontend
    restart: always
    depends_on:
      - backend

  # ==========================================
  # Nginx Production Reverse Proxy
  # ==========================================
  proxy:
    image: nginx:alpine
    container_name: naam-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
    driver: local
