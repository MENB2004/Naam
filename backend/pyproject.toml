[project]
name = "naam-backend"
version = "0.1.0"
description = "NAAM (നാം) - Environmental Monitoring and Governance Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "geoalchemy2>=0.15.2",
    "httpx>=0.27.2",
    "pydantic>=2.9.1",
    "pydantic-settings>=2.5.2",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"
