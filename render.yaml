services:
  - type: web
    name: naam-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: BACKEND_CORS_ORIGINS
        value: '["https://naam.vercel.app", "https://naam.kerala.gov.in"]'
      - key: DATABASE_URL
        fromDatabase:
          name: naam-database
          property: connectionString

databases:
  - name: naam-database
    plan: starter
    region: singapore
    databaseName: naam
    user: naamuser
    postgresMajorVersion: 16
